<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - ProdigalMath</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell page-center">
    <section class="dashboard-frame">
      <div class="card dashboard-card">
        <div class="dashboard-copy">
          <p class="eyebrow">All set</p>
          <h1 id="greeting">Hello 👋</h1>
          <p>Welcome to ProdigalMath. Ready for your next algebra challenge?</p>
        </div>
        <button onclick="goToProblems()">Start Practicing</button>
      </div>
    </section>
  </main>

  <script>
    function goToProblems() {
      window.location.href = 'index.html';
    }

    window.onload = function() {
      const username = localStorage.getItem('prodgicalmathLoggedInUser');
      if (username) {
        document.getElementById('greeting').textContent = `Hello ${username} 👋`;
      } else {
        window.location.href = 'login.html';
      }
    };
  </script>
</body>
</html>
